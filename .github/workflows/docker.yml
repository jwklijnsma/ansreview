name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a publish half-way; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The repository is called "-Ansreview", but an image name may not start with "-".
  IMAGE: ghcr.io/${{ github.repository_owner }}/ansreview
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # 1. Build for amd64 only and load it, so the smoke test runs the real image.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ansreview:test
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - CLI scan
        run: |
          set -euo pipefail
          docker run --rm ansreview:test --version
          cp -r examples/sample-repo "$RUNNER_TEMP/sample"
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/sample:/repos/sample" \
            ansreview:test scan /repos/sample --no-llm
          rc=$?
          set -e
          echo "scan exit code: $rc"
          test "$rc" -le 1   # 0 = clean, 1 = findings; 2+ = the tool failed
          python3 - "$RUNNER_TEMP/sample/.ansreview/report.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          rules = {f["rule"] for f in r["findings"]}
          errors = " ".join(r.get("errors") or [])
          print(f"{len(r['findings'])} findings, rules: {sorted(rules)}")
          assert "AR001" in rules, "static checks did not run"
          assert "ansible-lint" not in errors, f"ansible-lint broken in the image: {errors}"
          EOF

      - name: Smoke test - web UI
        run: |
          set -euo pipefail
          docker run -d --name ansreview -p 127.0.0.1:8765:8765 \
            --user "$(id -u):$(id -g)" \
            --health-interval=2s --health-start-period=2s \
            -e ANSREVIEW_WEB_TOKEN=ci-token \
            -v "$RUNNER_TEMP/sample:/repos/sample" \
            ansreview:test
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ansreview)" = healthy ] && break
            sleep 1
          done
          docker inspect -f 'health: {{.State.Health.Status}}' ansreview
          test "$(docker inspect -f '{{.State.Health.Status}}' ansreview)" = healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/repos)" = 401
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8765/api/repos | tee /dev/stderr | grep -q '"sample"'
          docker stop -t 15 ansreview
          code="$(docker inspect -f '{{.State.ExitCode}}' ansreview)"
          echo "exit code after docker stop: $code"
          test "$code" = 0   # SIGINT reached ansreview through tini and it shut down cleanly

      - name: Container logs
        if: always()
        run: docker logs ansreview 2>&1 || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Multi-arch build (amd64 comes from the cache above); pushed except on PRs.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
