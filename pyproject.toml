[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ansreview"
version = "0.1.0"
description = "Review Ansible codebases with ansible-lint, static security checks and a local Ollama model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jan Wiebe Klijnsma" }]
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
lint = ["ansible-lint>=24.0"]
dev = ["pytest>=8"]

[project.scripts]
ansreview = "ansreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
