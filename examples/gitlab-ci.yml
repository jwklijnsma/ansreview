# Add to your Ansible repo's .gitlab-ci.yml.
# Needs a runner that can reach your Ollama server; set OLLAMA_HOST as a CI/CD variable.

ansreview:
  stage: test
  image: python:3.12-slim
  variables:
    ANSREVIEW_MODEL: "qwen2.5-coder:14b"
    GIT_DEPTH: "0"            # diff mode needs history
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q "ansreview[lint] @ git+https://github.com/jwklijnsma/ansreview.git"
    - '[ -f requirements.yml ] && ansible-galaxy collection install -r requirements.yml || true'
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        ansreview --diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" -f md,gitlab -o .ansreview
      else
        ansreview -f md,gitlab -o .ansreview
      fi
  artifacts:
    when: always
    paths: [.ansreview/report.md]
    reports:
      codequality: .ansreview/gl-code-quality-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"     # schedules are for the job below
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# --- Or: one central job instead of a job in every repository ---------------------------
# Put ONLY this job in one project (for example "platform/ansreview") and add a pipeline
# schedule there (Build > Pipeline schedules, e.g. */10 * * * *). Each run looks at the open
# merge requests of the projects below, reviews new commits and keeps one comment per merge
# request up to date. The other repositories need no CI change at all.
#
# CI/CD variables of this project:
#   GITLAB_TOKEN  masked; group or project access token, scope api, on the watched projects
#   OLLAMA_HOST   your Ollama server, reachable from the runner
ansreview-merge-requests:
  stage: test
  image: python:3.12-slim
  variables:
    ANSREVIEW_MODEL: "qwen2.5-coder:14b"
    ANSREVIEW_GITLAB_URL: "$CI_SERVER_URL"
    ANSREVIEW_GITLAB_PROJECTS: "platform/infra,platform/roles"      # comma-separated
    # ANSREVIEW_GITLAB_GROUPS: "platform"                      # or whole groups
    GIT_STRATEGY: none                    # the job fetches the merge requests itself
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q "ansreview[lint] @ git+https://github.com/jwklijnsma/ansreview.git"
  script:
    - ansreview watch-mrs --once --state-dir "$CI_PROJECT_DIR/.mr-state"
  cache:                                  # checkouts between runs; losing it is harmless,
    key: ansreview-mr-state                  # the comment remembers which commit was reviewed
    paths: [.mr-state]
  resource_group: ansreview-merge-requests   # never two runs at once
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
